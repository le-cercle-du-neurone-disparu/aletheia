# « viewer » et non « minimal » : masque le bouton « Deploy » et les options de
# développement, mais conserve le menu de réglages — c'est lui qui porte le
# choix entre thème clair et sombre, dont les visiteurs ont besoin.
[client]
toolbarMode = "viewer"

# Les visuels sont servis comme fichiers plutôt qu'encodés dans la page :
# l'animation de Berlue pèse 300 Ko, que le navigateur met en cache une fois
# au lieu de les retélécharger à chaque rendu.
[server]
enableStaticServing = true
